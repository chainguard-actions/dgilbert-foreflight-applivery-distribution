name: Test build processing timeout fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Applivery API
        run: |
          rm -rf /tmp/mock-applivery && mkdir -p /tmp/mock-applivery
          MOCK_BUILD_STATUS=processing MOCK_GET_STATUS=processing nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-applivery.cjs" > /tmp/mock-applivery/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18080/health || { cat /tmp/mock-applivery/server.log; exit 1; }
          echo "fake ipa content" > /tmp/app.ipa
      - id: action
        uses: .
        continue-on-error: true
        with:
          base-url: http://127.0.0.1:18080/v1/
          base-uploads-url: http://127.0.0.1:18080/upload/v1/
          api-key: test-api-key
          build-path: /tmp/app.ipa
          branch-name: release
          max-attempts: '2'
          wait-time: '1'
      - name: Assert action failed after max attempts
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUB_ID: ${{ steps.action.outputs.publication-id }}
        run: |
          cat /tmp/mock-applivery/requests.log
          echo "outcome: $OUTCOME"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure"; exit 1; }
          [ -z "$PUB_ID" ] || { echo "FAIL: publication-id should be empty"; exit 1; }
          COUNT=$(grep -c '^GET /v1/integrations/builds/' /tmp/mock-applivery/requests.log)
          [ "$COUNT" -eq 2 ] || { echo "FAIL: expected 2 polls, got $COUNT"; exit 1; }
          if grep -q 'integrations/distributions' /tmp/mock-applivery/requests.log; then
            echo "FAIL: publications should not be touched after timeout"; exit 1
          fi
          echo "PASS"
