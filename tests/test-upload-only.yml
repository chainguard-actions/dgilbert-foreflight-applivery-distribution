name: Test upload-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Applivery API
        run: |
          mkdir -p /tmp/mock
          : > /tmp/mock/requests.log
          setsid nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_applivery.py" 18083 /tmp/mock/requests.log > /tmp/mock/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18083/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18083/health || { cat /tmp/mock/server.log; exit 1; }
          echo "dummy apk content" > /tmp/mock/app.apk
      - id: action
        uses: .
        with:
          base-url: http://127.0.0.1:18083/v1/
          base-uploads-url: http://127.0.0.1:18083/v1/
          api-key: test-api-key
          build-path: /tmp/mock/app.apk
          branch-name: release
          upload-only: 'true'
          skip-processing: 'true'
      - name: Assert only the upload happened
        env:
          BUILD_ID: ${{ steps.action.outputs.build-id }}
          PUB_ID: ${{ steps.action.outputs.publication-id }}
        run: |
          echo "build-id: $BUILD_ID"; echo "publication-id: $PUB_ID"
          cat /tmp/mock/requests.log
          [ "$BUILD_ID" = "build-123" ] || { echo "FAIL: build-id"; exit 1; }
          [ -z "$PUB_ID" ] || { echo "FAIL: publication-id should be empty"; exit 1; }
          grep -q '"path": "/v1/integrations/builds"' /tmp/mock/requests.log || { echo "FAIL: no upload"; exit 1; }
          if grep -q 'integrations/distributions' /tmp/mock/requests.log; then
            echo "FAIL: publications API should not be called"; exit 1
          fi
          echo "PASS"
