name: Test upload API error fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Applivery API
        run: |
          rm -rf /tmp/mock-applivery-err && mkdir -p /tmp/mock-applivery-err
          MOCK_PORT=18092 MOCK_LOG_DIR=/tmp/mock-applivery-err MOCK_UPLOAD_FAIL=true nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-applivery.cjs" > /tmp/mock-applivery-err/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18092/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18092/health || { cat /tmp/mock-applivery-err/server.log; exit 1; }
          echo "fake ipa content" > /tmp/app.ipa
      - id: action
        uses: .
        continue-on-error: true
        with:
          base-url: http://127.0.0.1:18092/v1/
          base-uploads-url: http://127.0.0.1:18092/upload/v1/
          api-key: bad-api-key
          build-path: /tmp/app.ipa
          branch-name: main
          skip-processing: 'true'
      - name: Assert failure after upload error
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUB_ID: ${{ steps.action.outputs.publication-id }}
        run: |
          D=/tmp/mock-applivery-err
          cat $D/requests.log
          echo "outcome: $OUTCOME"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure"; exit 1; }
          [ -z "$PUB_ID" ] || { echo "FAIL: publication-id should be empty"; exit 1; }
          grep -q '^POST /upload/v1/integrations/builds' $D/requests.log || { echo "FAIL: upload not attempted"; exit 1; }
          if grep -q 'integrations/distributions' $D/requests.log; then
            echo "FAIL: publications should not be touched after upload error"; exit 1
          fi
          echo "PASS"
