name: Test tags and password create a tag-filtered protected publication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Applivery API (ephemeral port)
        id: mock
        run: |
          export MOCK_PORT=0
          rm -f /tmp/mock-applivery/port
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-applivery.cjs" > /tmp/mock-applivery.out 2>&1 &
          for i in $(seq 1 30); do
            if [ -s /tmp/mock-applivery/port ]; then
              PORT=$(cat /tmp/mock-applivery/port)
              if curl -sf "http://127.0.0.1:$PORT/health" >/dev/null; then
                echo "mock ready on $PORT"
                echo "port=$PORT" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 1
          done
          cat /tmp/mock-applivery.out
          exit 1
      - id: action
        uses: .
        with:
          base-url: http://127.0.0.1:${{ steps.mock.outputs.port }}/v1/
          base-uploads-url: http://127.0.0.1:${{ steps.mock.outputs.port }}/upload/v1/
          api-key: test-api-key
          build-path: tests/fixtures/app.ipa
          branch-name: release
          slug-name: qa-build
          tags: qa,beta
          publication-password: s3cret-pass
          skip-processing: 'true'
      - name: Assert outputs
        env:
          PUB_ID: ${{ steps.action.outputs.publication-id }}
          PUB_SLUG: ${{ steps.action.outputs.publication-slug }}
        run: |
          echo "id: $PUB_ID"; echo "slug: $PUB_SLUG"
          [ "$PUB_ID" = "pub-new" ] || { echo "FAIL: expected pub-new"; exit 1; }
          [ "$PUB_SLUG" = "qa-build" ] || { echo "FAIL: expected qa-build"; exit 1; }
          echo "PASS"
      - name: Assert payloads
        run: |
          cat /tmp/mock-applivery/requests.log
          grep -q 'qa,beta' /tmp/mock-applivery/upload-build.txt || { echo "FAIL: tags not sent with upload"; exit 1; }
          CREATE=$(cat /tmp/mock-applivery/create-publication.json)
          echo "create payload: $CREATE"
          echo "$CREATE" | grep -q '"type":"tag"' || { echo "FAIL: filter type should be tag"; exit 1; }
          echo "$CREATE" | grep -q '"value":"qa,beta"' || { echo "FAIL: filter value should be tags"; exit 1; }
          echo "$CREATE" | grep -q '"security":"password"' || { echo "FAIL: security should be password"; exit 1; }
          echo "$CREATE" | grep -q '"password":"s3cret-pass"' || { echo "FAIL: password missing"; exit 1; }
          echo "PASS"
