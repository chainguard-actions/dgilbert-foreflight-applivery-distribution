name: Test tags filter and password publication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Applivery API
        run: |
          rm -rf /tmp/mock-applivery-tags && mkdir -p /tmp/mock-applivery-tags
          MOCK_PORT=18091 MOCK_LOG_DIR=/tmp/mock-applivery-tags nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-applivery.cjs" > /tmp/mock-applivery-tags/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18091/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18091/health || { cat /tmp/mock-applivery-tags/server.log; exit 1; }
          echo "fake ipa content" > /tmp/app.ipa
      - id: action
        uses: .
        with:
          base-url: http://127.0.0.1:18091/v1/
          base-uploads-url: http://127.0.0.1:18091/upload/v1/
          api-key: test-api-key
          build-path: /tmp/app.ipa
          branch-name: staging
          tags: ' alpha , beta ,, '
          publication-password: s3cret-pass
          skip-processing: 'true'
      - name: Assert tag filter and password security
        env:
          PUB_SLUG: ${{ steps.action.outputs.publication-slug }}
        run: |
          D=/tmp/mock-applivery-tags
          cat $D/requests.log || true
          echo "slug: $PUB_SLUG"
          [ "$PUB_SLUG" = "staging" ] || { echo "FAIL: slug"; exit 1; }
          CB=$(cat $D/create-body.json); echo "$CB"
          echo "$CB" | grep -q '"security":"password"' || { echo "FAIL: security"; exit 1; }
          echo "$CB" | grep -q '"password":"s3cret-pass"' || { echo "FAIL: password"; exit 1; }
          echo "$CB" | grep -q '"type":"tag"' || { echo "FAIL: filter type"; exit 1; }
          echo "$CB" | grep -q '"value":"alpha,beta"' || { echo "FAIL: filter value"; exit 1; }
          grep -q 'alpha,beta' $D/upload-body.txt || { echo "FAIL: tags in upload"; exit 1; }
          echo "PASS"
