name: Test tags filter and password-protected publication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Applivery API
        run: |
          mkdir -p /tmp/mock
          : > /tmp/mock/requests.log
          setsid nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_applivery.py" 18084 /tmp/mock/requests.log > /tmp/mock/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18084/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18084/health || { cat /tmp/mock/server.log; exit 1; }
          echo "dummy ipa content" > /tmp/mock/app.ipa
      - id: action
        uses: .
        with:
          base-url: http://127.0.0.1:18084/v1/
          base-uploads-url: http://127.0.0.1:18084/v1/
          api-key: test-api-key
          build-path: /tmp/mock/app.ipa
          branch-name: develop
          slug-name: beta-channel
          tags: ' beta , qa ,'
          publication-password: s3cret-pw
          skip-processing: 'true'
      - name: Assert publication created with tag filter and password
        env:
          PUB_ID: ${{ steps.action.outputs.publication-id }}
          PUB_SLUG: ${{ steps.action.outputs.publication-slug }}
        run: |
          echo "publication-id: $PUB_ID"; echo "slug: $PUB_SLUG"
          [ "$PUB_ID" = "pub-new" ] || { echo "FAIL: publication-id"; exit 1; }
          [ "$PUB_SLUG" = "beta-channel" ] || { echo "FAIL: slug"; exit 1; }
          python3 - <<'EOF'
          import json, sys
          reqs = [json.loads(l) for l in open('/tmp/mock/requests.log') if l.strip()]
          up = [r for r in reqs if r['method'] == 'POST' and r['path'].endswith('/integrations/builds')]
          if len(up) != 1: sys.exit('FAIL: expected one upload')
          if 'beta,qa' not in up[0]['body']: sys.exit('FAIL: upload tags not normalized to beta,qa')
          c = [r for r in reqs if r['method'] == 'POST' and r['path'].endswith('/integrations/distributions')]
          if len(c) != 1: sys.exit('FAIL: expected one publication create')
          p = json.loads(c[0]['body'])
          print(p)
          if p['security'] != 'password': sys.exit('FAIL: security %r' % p['security'])
          if p['password'] != 's3cret-pw': sys.exit('FAIL: password not sent')
          if p['filter'] != {'type': 'tag', 'value': 'beta,qa'}: sys.exit('FAIL: filter %r' % p['filter'])
          print('PASS')
          EOF
