name: Test waiting for build processing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Applivery API (upload returns queued, ephemeral port)
        id: mock
        run: |
          export MOCK_PORT=0
          export MOCK_UPLOAD_STATUS=queued
          export MOCK_BUILD_STATUS=processed
          rm -f /tmp/mock-applivery/port
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-applivery.cjs" > /tmp/mock-applivery.out 2>&1 &
          for i in $(seq 1 30); do
            if [ -s /tmp/mock-applivery/port ]; then
              PORT=$(cat /tmp/mock-applivery/port)
              if curl -sf "http://127.0.0.1:$PORT/health" >/dev/null; then
                echo "mock ready on $PORT"
                echo "port=$PORT" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 1
          done
          cat /tmp/mock-applivery.out
          exit 1
      - id: action
        uses: .
        with:
          base-url: http://127.0.0.1:${{ steps.mock.outputs.port }}/v1/
          base-uploads-url: http://127.0.0.1:${{ steps.mock.outputs.port }}/upload/v1/
          api-key: test-api-key
          build-path: tests/fixtures/app.ipa
          branch-name: develop
          max-attempts: '3'
          wait-time: '1'
      - name: Assert build status was polled and publication created
        env:
          PUB_SLUG: ${{ steps.action.outputs.publication-slug }}
        run: |
          cat /tmp/mock-applivery/requests.log
          echo "slug: $PUB_SLUG"
          [ "$PUB_SLUG" = "develop" ] || { echo "FAIL: expected slug develop"; exit 1; }
          COUNT=$(grep -c '^GET /v1/integrations/builds/build-123$' /tmp/mock-applivery/requests.log || true)
          [ "$COUNT" = "1" ] || { echo "FAIL: expected exactly 1 poll, got $COUNT"; exit 1; }
          grep -q '^POST /v1/integrations/distributions$' /tmp/mock-applivery/requests.log || { echo "FAIL: no publication create"; exit 1; }
          echo "PASS"
