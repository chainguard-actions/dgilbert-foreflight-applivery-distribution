name: Test waiting for build processing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Applivery API
        run: |
          rm -rf /tmp/mock-applivery-wait && mkdir -p /tmp/mock-applivery-wait
          MOCK_PORT=18093 MOCK_LOG_DIR=/tmp/mock-applivery-wait MOCK_BUILD_STATUS=processing MOCK_GET_STATUS=processed nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-applivery.cjs" > /tmp/mock-applivery-wait/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18093/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18093/health || { cat /tmp/mock-applivery-wait/server.log; exit 1; }
          echo "fake ipa content" > /tmp/app.ipa
      - id: action
        uses: .
        with:
          base-url: http://127.0.0.1:18093/v1/
          base-uploads-url: http://127.0.0.1:18093/upload/v1/
          api-key: test-api-key
          build-path: /tmp/app.ipa
          branch-name: release
          max-attempts: '3'
          wait-time: '1'
      - name: Assert build status was polled and outputs set
        env:
          PUB_ID: ${{ steps.action.outputs.publication-id }}
          PUB_SLUG: ${{ steps.action.outputs.publication-slug }}
        run: |
          D=/tmp/mock-applivery-wait
          cat $D/requests.log
          echo "id: $PUB_ID"; echo "slug: $PUB_SLUG"
          grep -q '^GET /v1/integrations/builds/build-123' $D/requests.log || { echo "FAIL: build not polled"; exit 1; }
          COUNT=$(grep -c '^GET /v1/integrations/builds/' $D/requests.log)
          [ "$COUNT" -ge 1 ] || { echo "FAIL: expected at least 1 poll, got $COUNT"; exit 1; }
          [ "$PUB_ID" = "pub-new" ] || { echo "FAIL: id"; exit 1; }
          [ "$PUB_SLUG" = "release" ] || { echo "FAIL: slug"; exit 1; }
          echo "PASS"
