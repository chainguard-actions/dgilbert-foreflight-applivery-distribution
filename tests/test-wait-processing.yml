name: Test waiting for build processing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Applivery API
        env:
          MOCK_UPLOAD_STATUS: queued
          MOCK_GET_STATUS: processed
        run: |
          mkdir -p /tmp/mock
          : > /tmp/mock/requests.log
          setsid nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_applivery.py" 18085 /tmp/mock/requests.log > /tmp/mock/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18085/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18085/health || { cat /tmp/mock/server.log; exit 1; }
          echo "dummy ipa content" > /tmp/mock/app.ipa
      - id: action
        uses: .
        with:
          base-url: http://127.0.0.1:18085/v1/
          base-uploads-url: http://127.0.0.1:18085/v1/
          api-key: test-api-key
          build-path: /tmp/mock/app.ipa
          branch-name: main
          upload-only: 'true'
          max-attempts: '3'
          wait-time: '1'
      - name: Assert build status was polled
        env:
          BUILD_ID: ${{ steps.action.outputs.build-id }}
        run: |
          echo "build-id: $BUILD_ID"
          cat /tmp/mock/requests.log
          [ "$BUILD_ID" = "build-123" ] || { echo "FAIL: build-id"; exit 1; }
          n=$(grep -c '"method": "GET", "path": "/v1/integrations/builds/build-123"' /tmp/mock/requests.log || true)
          echo "polls: $n"
          [ "$n" = "1" ] || { echo "FAIL: expected exactly one status poll"; exit 1; }
          echo "PASS"
