name: Test failure when build never finishes processing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Applivery API (build stays queued, ephemeral port)
        id: mock
        run: |
          export MOCK_PORT=0
          export MOCK_UPLOAD_STATUS=queued
          export MOCK_BUILD_STATUS=queued
          rm -f /tmp/mock-applivery/port
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-applivery.cjs" > /tmp/mock-applivery.out 2>&1 &
          for i in $(seq 1 30); do
            if [ -s /tmp/mock-applivery/port ]; then
              PORT=$(cat /tmp/mock-applivery/port)
              if curl -sf "http://127.0.0.1:$PORT/health" >/dev/null; then
                echo "mock ready on $PORT"
                echo "port=$PORT" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 1
          done
          cat /tmp/mock-applivery.out
          exit 1
      - id: action
        uses: .
        continue-on-error: true
        with:
          base-url: http://127.0.0.1:${{ steps.mock.outputs.port }}/v1/
          base-uploads-url: http://127.0.0.1:${{ steps.mock.outputs.port }}/upload/v1/
          api-key: test-api-key
          build-path: tests/fixtures/app.ipa
          branch-name: develop
          max-attempts: '2'
          wait-time: '1'
      - name: Assert action failed after max attempts
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUB_ID: ${{ steps.action.outputs.publication-id }}
        run: |
          cat /tmp/mock-applivery/requests.log
          echo "outcome: $OUTCOME"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure"; exit 1; }
          [ -z "$PUB_ID" ] || { echo "FAIL: no publication-id expected"; exit 1; }
          COUNT=$(grep -c '^GET /v1/integrations/builds/build-123$' /tmp/mock-applivery/requests.log || true)
          [ "$COUNT" = "2" ] || { echo "FAIL: expected 2 polls, got $COUNT"; exit 1; }
          if grep -q 'integrations/distributions' /tmp/mock-applivery/requests.log; then
            echo "FAIL: should not touch publications"; exit 1
          fi
          echo "PASS"
