name: Test reuse of existing publication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Applivery API
        env:
          MOCK_EXISTING_SLUGS: my-app
        run: |
          mkdir -p /tmp/mock
          : > /tmp/mock/requests.log
          setsid nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_applivery.py" 18082 /tmp/mock/requests.log > /tmp/mock/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18082/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18082/health || { cat /tmp/mock/server.log; exit 1; }
          echo "dummy ipa content" > /tmp/mock/app.ipa
      - id: action
        uses: .
        with:
          base-url: http://127.0.0.1:18082/v1
          base-uploads-url: http://127.0.0.1:18082/v1
          api-key: test-api-key
          build-path: /tmp/mock/app.ipa
          branch-name: main
          slug-name: My-App
      - name: Assert existing publication reused
        env:
          PUB_ID: ${{ steps.action.outputs.publication-id }}
          PUB_SLUG: ${{ steps.action.outputs.publication-slug }}
          PUB_URL: ${{ steps.action.outputs.publication-distribution-url }}
        run: |
          echo "publication-id: $PUB_ID"; echo "slug: $PUB_SLUG"; echo "url: $PUB_URL"
          cat /tmp/mock/requests.log
          [ "$PUB_ID" = "pub-existing" ] || { echo "FAIL: expected pub-existing"; exit 1; }
          [ "$PUB_SLUG" = "my-app" ] || { echo "FAIL: expected lowercased slug my-app"; exit 1; }
          [ "$PUB_URL" = "https://dl.example.com/my-app" ] || { echo "FAIL: url"; exit 1; }
          if grep -q '"method": "POST", "path": "/v1/integrations/distributions"' /tmp/mock/requests.log; then
            echo "FAIL: publication should not have been created"; exit 1
          fi
          grep -q 'slug=my-app' /tmp/mock/requests.log || { echo "FAIL: lookup by slug missing"; exit 1; }
          echo "PASS"
